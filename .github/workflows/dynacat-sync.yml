name: Sync Dynacat version bump

# Dependabot (.github/dependabot.yml) opens a PR bumping dynacat/Dockerfile's
# FROM tag whenever a new ghcr.io/panonim/dynacat release appears, but it only
# touches that one line. This workflow finds that PR, propagates the version
# into dynacat/config.yaml, the READMEs, and DOCS.md, writes a CHANGELOG.md
# entry, and auto-merges it -- but only when the new release doesn't touch any
# of the upstream files this addon has previously needed a human judgment call
# on (see CHANGELOG.md's 3.0.0-1/3.0.2-1 entries for the precedent). Otherwise
# it leaves a comment explaining what to check and does not merge.
#
# Runs on a schedule rather than `pull_request` so it always gets full
# `contents`/`pull-requests` permissions -- GitHub forces those to read-only
# on pull_request events triggered by Dependabot.
#
# This job has write access to main and merges PRs on its own, so the PR it
# acts on cannot be trusted by branch name alone -- a PR from any fork can use
# any headRefName it likes. "Find the open Dynacat Dependabot PR" below
# requires the PR to actually be authored by dependabot[bot] and to live in
# this repo (not a fork). "Verify the PR only bumps the pinned version" then
# independently re-derives that from the PR's own content before anything
# downstream trusts it: the changed-file list must be exactly
# dynacat/Dockerfile, the new version must match ^[0-9]+\.[0-9]+\.[0-9]+$, and
# the file's content must be byte-for-byte identical to main's Dockerfile with
# only that version substituted -- so a PR that smuggles in any other change,
# to that file or any other, fails closed (the step exits 1, which stops the
# whole job -- no merge, no comment, just a failed run for a human to notice).
# The upstream-diff review after that can also fail closed (tags missing,
# clone/diff errors), but takes the gentler "comment and leave open" path,
# since touching a file this addon depends on is an expected, non-hostile
# outcome of a real release, not a sign the PR was tampered with.
#
# All `${{ steps.*.outputs.* }}` values are passed into scripts via `env:` and
# read back as `$VAR`, never interpolated directly into `run:` bodies.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the open Dynacat Dependabot PR
        id: find_pr
        run: |
          set -euo pipefail
          PR_JSON=$(gh pr list --state open \
            --json number,headRefName,author,isCrossRepository,headRefOid \
            --jq '[.[]
              | select(.headRefName | startswith("dependabot/docker/dynacat/"))
              | select(.author.login == "dependabot[bot]")
              | select(.isCrossRepository == false)
            ][0]')
          if [ "$PR_JSON" = "null" ] || [ -z "$PR_JSON" ]; then
            echo "No open Dynacat Dependabot PR found, nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$PR_JSON" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$PR_JSON" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Read the currently pinned version (main)
        if: steps.find_pr.outputs.found == 'true'
        id: old_version
        run: |
          set -euo pipefail
          DOCKERFILE_VERSION=$(grep -oP 'ghcr\.io/panonim/dynacat:\K[0-9.]+' dynacat/Dockerfile | head -n1)
          CONFIG_VERSION=$(grep -oP 'version:\s*"\K[0-9.]+(?=-)' dynacat/config.yaml | head -n1)
          for v in "$DOCKERFILE_VERSION" "$CONFIG_VERSION"; do
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Pinned version '$v' on main doesn't look like X.Y.Z" >&2
              exit 1
            fi
          done
          echo "dockerfile=$DOCKERFILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the PR only bumps the pinned version
        if: steps.find_pr.outputs.found == 'true'
        id: verify_pr
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
          LISTED_HEAD_SHA: ${{ steps.find_pr.outputs.head_sha }}
          OLD_DOCKERFILE: ${{ steps.old_version.outputs.dockerfile }}
        run: |
          set -euo pipefail

          gh pr checkout "$PR_NUMBER"

          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$CURRENT_SHA" != "$LISTED_HEAD_SHA" ]; then
            echo "::error::PR head moved between listing and checkout ($LISTED_HEAD_SHA -> $CURRENT_SHA), aborting" >&2
            exit 1
          fi

          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          if [ "$CHANGED_FILES" != "dynacat/Dockerfile" ]; then
            echo "::error::PR changes more than dynacat/Dockerfile: $CHANGED_FILES" >&2
            exit 1
          fi

          NEW=$(grep -oP 'ghcr\.io/panonim/dynacat:\K[0-9.]+' dynacat/Dockerfile | head -n1)
          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::New version '$NEW' doesn't look like X.Y.Z" >&2
            exit 1
          fi

          OLD_PATTERN=$(printf '%s' "$OLD_DOCKERFILE" | sed 's/\./\\./g')
          EXPECTED=$(git show main:dynacat/Dockerfile | sed "s/${OLD_PATTERN}/${NEW}/")
          ACTUAL=$(cat dynacat/Dockerfile)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::dynacat/Dockerfile differs from main by more than the version tag" >&2
            exit 1
          fi

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "head_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Review upstream diff for anything this addon depends on
        if: steps.find_pr.outputs.found == 'true'
        id: review
        env:
          OLD_DOCKERFILE: ${{ steps.old_version.outputs.dockerfile }}
          OLD_CONFIG: ${{ steps.old_version.outputs.config }}
          NEW: ${{ steps.verify_pr.outputs.version }}
        run: |
          set -euo pipefail

          CLONE_DIR=$(mktemp -d)
          git clone --quiet https://github.com/Panonim/dynacat.git "$CLONE_DIR"

          SAFE=true
          REASON=""
          if [ "$OLD_DOCKERFILE" != "$OLD_CONFIG" ]; then
            SAFE=false
            REASON="dynacat/config.yaml ($OLD_CONFIG) and dynacat/Dockerfile ($OLD_DOCKERFILE) were already out of sync on main before this upgrade."
          elif ! git -C "$CLONE_DIR" rev-parse --verify --quiet "refs/tags/${OLD_DOCKERFILE}^{commit}" >/dev/null \
            || ! git -C "$CLONE_DIR" rev-parse --verify --quiet "refs/tags/${NEW}^{commit}" >/dev/null; then
            SAFE=false
            REASON="Could not find tag $OLD_DOCKERFILE and/or $NEW in Panonim/dynacat upstream."
          else
            RISK_PATHS="Dockerfile internal/dynacat/config.go internal/dynacat/widget-clock.go internal/dynacat/widget-weather.go internal/dynacat/widget-rss.go internal/dynacat/widget-bookmarks.go"
            if ! CHANGED=$(git -C "$CLONE_DIR" diff --name-only "$OLD_DOCKERFILE" "$NEW" -- $RISK_PATHS); then
              SAFE=false
              REASON="Failed to diff upstream tags $OLD_DOCKERFILE..$NEW."
            elif [ -n "$CHANGED" ]; then
              SAFE=false
              REASON="Changed upstream between $OLD_DOCKERFILE and $NEW: $(echo "$CHANGED" | tr '\n' ' ')"
            fi
          fi

          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<REASON_EOF"
            echo "$REASON"
            echo "REASON_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply the version sync and merge
        if: steps.find_pr.outputs.found == 'true' && steps.review.outputs.safe == 'true'
        env:
          OLD: ${{ steps.old_version.outputs.dockerfile }}
          NEW: ${{ steps.verify_pr.outputs.version }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: |
          set -euo pipefail
          NEW_FULL="${NEW}-1"
          COMPARE_URL="https://github.com/Panonim/dynacat/compare/${OLD}...${NEW}"
          OLD_PATTERN=$(printf '%s' "$OLD" | sed 's/\./\\./g')

          sed -i "s/${OLD_PATTERN}/${NEW}/g" README.md dynacat/README.md dynacat/DOCS.md
          sed -i "s/^version: \".*\"/version: \"${NEW_FULL}\"/" dynacat/config.yaml

          {
            head -n 1 dynacat/CHANGELOG.md
            echo "## ${NEW_FULL}"
            echo
            echo "- Upgrade packaged Dynacat from \`${OLD}\` to \`${NEW}\` (automated by"
            echo "  \`.github/workflows/dynacat-sync.yml\`). No changes were detected upstream in"
            echo "  the Dockerfile's final stage, the \`server.base-url\`/\${VAR} substitution"
            echo "  mechanism (\`internal/dynacat/config.go\`), or the"
            echo "  \`clock\`/\`weather\`/\`rss\`/\`bookmarks\` widgets used by \`dynacat.yml.starter\`,"
            echo "  so this was auto-merged without manual review. Upstream changes:"
            echo "  ${COMPARE_URL}"
            echo
            tail -n +2 dynacat/CHANGELOG.md
          } > dynacat/CHANGELOG.md.new
          mv dynacat/CHANGELOG.md.new dynacat/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md dynacat/README.md dynacat/DOCS.md dynacat/config.yaml dynacat/CHANGELOG.md
          git diff --cached --quiet || git commit -m "Sync version references for Dynacat ${NEW}"
          git push

          MERGED_SHA=$(git rev-parse HEAD)
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$MERGED_SHA"

      - name: Leave the PR for manual review
        if: steps.find_pr.outputs.found == 'true' && steps.review.outputs.safe == 'false'
        env:
          OLD: ${{ steps.old_version.outputs.dockerfile }}
          NEW: ${{ steps.verify_pr.outputs.version }}
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
          REASON: ${{ steps.review.outputs.reason }}
        run: |
          set -euo pipefail
          BODY="This upgrade (\`${OLD}\` → \`${NEW}\`) was **not** auto-merged.

          ${REASON}

          Review for breaking changes to the Dockerfile's final stage, the \`server.base-url\` substitution mechanism, or the \`clock\`/\`weather\`/\`rss\`/\`bookmarks\` widgets in \`dynacat.yml.starter\` -- the same checks prior Dynacat upgrades in this repo made by hand (see \`dynacat/CHANGELOG.md\`'s \`3.0.0-1\`/\`3.0.2-1\` entries for precedent). If it's safe, finish this PR manually: bump \`dynacat/config.yaml\`, the pinned-version mentions in the READMEs/DOCS.md, add a CHANGELOG.md entry, then merge."
          gh pr comment "$PR_NUMBER" --body "$BODY"
